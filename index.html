<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>先生クイズ</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0d14;--card:#16162a;--card2:#1c1c30;--border:rgba(255,255,255,0.07);--text:#f0f0f0;--muted:#666}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:'Noto Sans JP',sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
.screen{display:none;height:100vh;flex-direction:column;overflow:hidden}
.screen.active{display:flex}

/* SHARED */
.hdr{background:#111120;border-bottom:1px solid var(--border);padding:11px 14px;display:flex;align-items:center;gap:10px;flex-shrink:0}
.hdr-back{background:none;border:none;color:var(--muted);font-size:1.3rem;cursor:pointer;padding:2px 6px}
.hdr-title{font-size:1.15rem;font-weight:900;color:white;flex:1}
.hdr-act{background:none;border:none;color:#ffd700;font-size:1rem;font-weight:700;cursor:pointer}
.scrollbody{flex:1;overflow-y:auto;padding:16px 15px 40px;-webkit-overflow-scrolling:touch}
.btn{width:100%;padding:15px;border:none;border-radius:13px;font-family:inherit;font-size:1rem;font-weight:900;cursor:pointer;color:white;margin-bottom:9px;transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.inp{width:100%;background:var(--card);border:1.5px solid var(--border);border-radius:11px;padding:13px 15px;color:white;font-family:inherit;font-size:.95rem;margin-bottom:15px;outline:none}
.inp:focus{border-color:#ffd700}
.lbl{font-size:.72rem;font-weight:700;color:var(--muted);letter-spacing:1px;margin-bottom:7px;display:block}
.chip{padding:8px 15px;border-radius:99px;border:2px solid rgba(255,255,255,.1);background:var(--card);color:var(--muted);font-family:inherit;font-size:.8rem;font-weight:700;cursor:pointer;margin-right:7px;margin-bottom:7px}
.chip.active-shakai{border-color:#ff6666;background:rgba(255,80,80,.18);color:#ff6666}
.chip.active-sansu{border-color:#ffaa44;background:rgba(255,170,30,.18);color:#ffaa44}
.chip.active-kokugo{border-color:#6699ff;background:rgba(30,100,200,.18);color:#6699ff}
.chip.active-rika{border-color:#44cc88;background:rgba(30,160,80,.18);color:#44cc88}
.upl{width:100%;border:2px dashed rgba(255,255,255,.12);border-radius:15px;padding:24px 15px;text-align:center;cursor:pointer;position:relative;margin-bottom:13px}
.upl.has-files{border-color:#44cc88}
.upl input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.log-wrap{background:#090910;border-radius:9px;padding:11px;margin-bottom:11px;font-size:.76rem;font-family:monospace;max-height:170px;overflow-y:auto;line-height:1.9}
.log-ok{color:#44cc88}.log-err{color:#ff6666}.log-info{color:#ffd700}
.prog-bar{height:4px;background:rgba(255,255,255,.07);border-radius:99px;overflow:hidden;margin-bottom:9px}
.prog-fill{height:100%;background:linear-gradient(90deg,#ffd700,#ff6b35);transition:width .4s}
.thumb-strip{display:flex;gap:5px;overflow-x:auto;margin-bottom:13px;padding-bottom:5px}
.thumb-strip img{width:60px;height:60px;border-radius:7px;object-fit:cover;flex-shrink:0}
.thumb-more{width:60px;height:60px;border-radius:7px;background:rgba(255,255,255,.05);display:flex;align-items:center;justify-content:center;color:var(--muted);flex-shrink:0;font-size:.74rem}

/* HOME */
#home{overflow:hidden;background:radial-gradient(ellipse at 25% 15%,#1a0a2e,transparent 55%),radial-gradient(ellipse at 80% 85%,#0a182e,transparent 50%),var(--bg)}
.home-logo{font-size:2.1rem;font-weight:900;color:#ffd700;text-align:center;padding:30px 16px 5px}
.home-sub{color:var(--muted);font-size:.75rem;letter-spacing:2px;text-align:center;margin-bottom:22px}
.test-card{background:var(--card);border:1.5px solid var(--border);border-radius:15px;padding:14px 15px;margin-bottom:11px;cursor:pointer;display:flex;justify-content:space-between;align-items:flex-start}
.test-card:active{opacity:.8}
.tc-name{font-size:1rem;font-weight:900;margin-bottom:3px}
.tc-meta{font-size:.72rem;color:var(--muted)}
.tc-del{background:none;border:none;color:#444;cursor:pointer;font-size:1rem;padding:3px}
.new-btn{width:100%;padding:15px;border:2px dashed rgba(255,255,255,.12);border-radius:13px;background:transparent;color:var(--muted);font-family:inherit;font-size:.9rem;font-weight:700;cursor:pointer;margin-top:3px}

/* DETAIL */
.subj-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.subj-card{background:var(--card);border-radius:16px;overflow:hidden;cursor:pointer}
.subj-card:active{opacity:.8}
.subj-card img{width:100%;height:240px;object-fit:contain;display:block;padding:10px;background:rgba(0,0,0,.2)}
.subj-card .si{padding:14px 16px}
.si-sub{font-size:1.5rem;font-weight:900;opacity:1;margin-bottom:6px}
.si-name{font-size:1.3rem;font-weight:900}
.si-count{font-size:.9rem;color:var(--muted);margin-top:4px}

/* INTRO */
#intro{position:relative;overflow:hidden;justify-content:flex-end}
.intro-bg{position:absolute;inset:0}
.intro-test-name{
  position:absolute;top:18px;left:50%;transform:translateX(-50%);
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);
  border-radius:99px;padding:5px 20px;
  font-size:.8rem;font-weight:700;color:rgba(255,255,255,.7);
  white-space:nowrap;z-index:2;letter-spacing:1px;
}
.intro-char-wrap{position:absolute;bottom:230px;left:50%;transform:translateX(-50%);width:260px;z-index:1}
.intro-char-wrap img{width:100%;filter:drop-shadow(0 8px 32px rgba(0,0,0,.8))}
.intro-panel{position:relative;width:100%;background:#15152a;border-top:2px solid rgba(255,255,255,.1);padding:16px 22px 28px;z-index:2}
.intro-lbl{font-size:.72rem;font-weight:700;letter-spacing:1px;margin-bottom:6px;opacity:.8}
.intro-cheer{
  font-size:1.15rem;font-weight:900;line-height:1.5;
  margin-bottom:6px;color:white;
}
.intro-txt{font-size:.9rem;font-weight:700;line-height:1.6;margin-bottom:14px;color:rgba(255,255,255,.7)}
.intro-start-btn{
  width:auto !important;
  min-width:200px;
  padding:15px 40px !important;
  border-radius:99px !important;
  font-size:1.1rem !important;
}

/* ════════ QUIZ ════════ */
#quiz{background:var(--bg)}

/* スコアバー */
.qz-bar{display:flex;align-items:center;justify-content:space-between;padding:7px 14px 5px;flex-shrink:0}
.qz-score-badge{font-size:.95rem;font-weight:900;color:#ffd700}
.qz-right-badges{display:flex;align-items:center;gap:7px}
.qz-streak-badge{background:rgba(255,80,80,.18);border:1px solid rgba(255,80,80,.3);border-radius:99px;padding:3px 10px;font-size:.78rem;font-weight:900;color:#ff8888}
.qz-num-badge{background:rgba(255,255,255,.07);border-radius:99px;padding:3px 10px;font-size:.76rem;font-weight:700;color:var(--muted)}

/* セグメント進捗 */
.qz-segs-row{display:flex;gap:3px;padding:0 14px 7px}
.qz-seg{flex:1;height:5px;border-radius:99px;background:rgba(255,255,255,.1);transition:background .3s}
.qz-seg.ok{background:#44cc88}
.qz-seg.ng{background:#ff5555}
.qz-seg.cur{background:#ffd700;animation:segPulse 1.2s ease-in-out infinite}
@keyframes segPulse{0%,100%{opacity:1}50%{opacity:.4}}

/* メインカード */
.qz-card{
  margin:0 11px 7px;
  background:var(--card);
  border-radius:18px;
  display:flex;
  flex-direction:row;
  overflow:hidden;
  flex-shrink:0;
}

/* キャラ列 ← 2回り大きく */
.qz-char-col{
  width:300px;
  flex-shrink:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-end;
  background:rgba(0,0,0,.18);
  position:relative;
}
.qz-char-img{
  width:300px;
  height:300px;
  object-fit:contain;
  object-position:bottom center;
  filter:drop-shadow(0 4px 16px rgba(0,0,0,.5));
}
/* セリフバブル ← 大きく */
.qz-bubble{
  width:100%;
  background:rgba(8,8,20,.94);
  border-top:1px solid rgba(255,255,255,.1);
  padding:8px 10px;
  text-align:center;
  flex-shrink:0;
}
.qz-bubble-name{font-size:.9rem;font-weight:700;opacity:.6;margin-bottom:3px}
.qz-bubble-txt{font-size:1.1rem;font-weight:700;line-height:1.5;color:white}

/* 問題列 */
.qz-q-col{
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:14px 14px;
}
.qz-q-tag{display:none}
.qz-q-txt{
  font-size:2.4rem;
  font-weight:900;
  line-height:1.5;
  color:white;
}

/* 下部 */
.qz-bottom{
  flex:1;
  display:flex;
  flex-direction:column;
  padding:0 11px 11px;
  min-height:0;
  overflow:hidden;
}

/* 選択肢 ← 少し小さく */
.qz-choices{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
  margin-bottom:7px;
  flex:1;
}
.qz-cbtn{
  background:var(--card2);
  border:2px solid rgba(255,255,255,.08);
  border-radius:13px;
  color:var(--text);
  font-family:inherit;
  font-size:2rem;
  font-weight:700;
  cursor:pointer;
  text-align:center;
  display:flex;align-items:center;justify-content:center;
  padding:4px 7px;
  line-height:1.2;
  transition:all .15s;
  width:100%;height:100%;
}
.qz-cbtn:active:not(:disabled){transform:scale(.96);background:#20203a}
.qz-cbtn.correct{background:rgba(68,200,120,.2);border-color:#44cc88;color:#44cc88;animation:correctPop .3s}
.qz-cbtn.wrong{background:rgba(255,80,80,.18);border-color:#ff5555;color:#ff8888}
.qz-cbtn:disabled{cursor:default}
@keyframes correctPop{0%{transform:scale(1)}50%{transform:scale(1.04)}100%{transform:scale(1)}}

/* フィードバックバナー ← 正解時は大きくインパクト */
.qz-feedback{
  border-radius:14px;padding:18px 18px;margin-bottom:7px;
  display:none;flex-direction:row;align-items:center;gap:12px;flex-shrink:0;
}
.qz-feedback.ok{
  background:linear-gradient(135deg,rgba(68,200,120,.22),rgba(68,200,120,.08));
  border:2px solid rgba(68,200,120,.5);
  display:flex;
  animation:fbSlideIn .3s ease;
}
.qz-feedback.ng{
  background:rgba(255,80,80,.1);
  border:1.5px solid rgba(255,80,80,.3);
  display:flex;
  animation:fbSlideIn .3s ease;
}
@keyframes fbSlideIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.qz-fb-icon{font-size:2rem;flex-shrink:0}  /* アイコン大きく */
.qz-fb-body{flex:1}
.qz-fb-title{font-weight:900;margin-bottom:3px}
.qz-fb-title.ok{color:#44cc88;font-size:1.3rem}  /* 正解タイトル大きく */
.qz-fb-title.ng{color:#ff8888;font-size:.9rem}
.qz-fb-explain{font-size:.95rem;color:#ccc;line-height:1.6}  /* 解説大きく */

/* 次へ */
.qz-next{
  width:50%;padding:20px 13px;border:none;border-radius:14px;
  font-family:inherit;font-size:1rem;font-weight:900;
  cursor:pointer;color:white;display:none;
  align-items:center;justify-content:center;gap:5px;
  flex-shrink:0;
  align-self:center;
}
.qz-next.show{display:flex;animation:fadeIn .3s}
.qz-next:active{transform:scale(.97)}

/* RESULT */
#result{justify-content:center;align-items:center;overflow-y:auto;padding:22px 17px 38px}
.res-char{width:180px;margin-bottom:5px}
.res-char img{width:100%;filter:drop-shadow(0 8px 24px rgba(0,0,0,.5))}
.res-title{font-size:1.8rem;font-weight:900;text-align:center;margin-bottom:2px}
.res-pts{font-size:2.7rem;font-weight:900;color:#ffd700;text-align:center}
.res-ptslbl{color:var(--muted);font-size:.72rem;text-align:center;margin-bottom:16px}
.res-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-bottom:18px;width:100%;max-width:330px}
.rstat{background:var(--card);border-radius:11px;padding:11px 7px;text-align:center;border:1px solid var(--border)}
.rstat .rl{font-size:.62rem;color:var(--muted)}
.rstat .rv{font-size:1.25rem;font-weight:900;margin-top:2px}
.res-msg{font-size:.9rem;font-weight:700;text-align:center;margin-bottom:16px;color:#bbb;padding:0 14px;line-height:1.7}

/* MISC */
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);padding:9px 20px;border-radius:99px;font-size:.85rem;font-weight:700;opacity:0;pointer-events:none;transition:opacity .3s;z-index:9999;white-space:nowrap;color:white}
.toast.show{opacity:1}
.confetti-c{position:fixed;inset:0;pointer-events:none;z-index:9999;overflow:hidden}
.cf{position:absolute;top:-20px;border-radius:2px;animation:cfFall linear forwards}
@keyframes cfFall{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(110vh) rotate(720deg);opacity:0}}
@keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}

/* RESULT拡張 */
#result{overflow:hidden;padding:0}
.res-char{width:160px;margin-bottom:4px;flex-shrink:0}
.res-char img{width:100%;filter:drop-shadow(0 8px 24px rgba(0,0,0,.5))}
.res-title{font-size:1.7rem;font-weight:900;text-align:center;margin-bottom:2px}
.res-pts{font-size:2.5rem;font-weight:900;color:#ffd700;text-align:center}
.res-ptslbl{color:var(--muted);font-size:.72rem;text-align:center;margin-bottom:12px}
.res-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px;width:100%;max-width:330px}
.rstat{background:var(--card);border-radius:11px;padding:10px 7px;text-align:center;border:1px solid var(--border)}
.rstat .rl{font-size:.62rem;color:var(--muted)}
.rstat .rv{font-size:1.2rem;font-weight:900;margin-top:2px}
.res-msg{font-size:.88rem;font-weight:700;text-align:center;margin-bottom:12px;color:#bbb;padding:0 14px;line-height:1.7}

/* 間違え直しボタン */
.res-revenge-btn{
  background:linear-gradient(135deg,#ff5555,#cc2222) !important;
  border-radius:13px;font-size:1rem;
  animation:revengePulse 1.8s ease-in-out infinite;
}
@keyframes revengePulse{0%,100%{box-shadow:0 0 0 0 rgba(255,80,80,.4)}50%{box-shadow:0 0 0 10px rgba(255,80,80,0)}}
.res-wrong-list{
  background:rgba(255,80,80,.08);border:1px solid rgba(255,80,80,.2);
  border-radius:11px;padding:10px 12px;margin-top:6px;
  font-size:.78rem;color:#ff8888;line-height:2;
}
.res-wrong-item{display:flex;align-items:flex-start;gap:6px;padding:2px 0}
.res-wrong-item::before{content:'❌';flex-shrink:0}

/* リベンジモード演出 */
.revenge-banner{
  position:fixed;top:0;left:0;right:0;
  background:linear-gradient(135deg,#ff5555,#ff8800);
  color:white;text-align:center;
  font-size:1rem;font-weight:900;
  padding:10px;z-index:9998;
  animation:bannerSlide .5s ease;
}
@keyframes bannerSlide{from{transform:translateY(-100%)}to{transform:translateY(0)}}

/* リベンジ正解演出 */
.revenge-badge{
  position:fixed;top:60px;left:50%;transform:translateX(-50%);
  background:linear-gradient(135deg,#ff6b35,#ffd700);
  color:white;font-size:1.1rem;font-weight:900;
  padding:10px 28px;border-radius:99px;
  z-index:9998;white-space:nowrap;
  animation:revBadge .6s cubic-bezier(.175,.885,.32,1.275);
  box-shadow:0 4px 20px rgba(255,107,53,.5);
}
@keyframes revBadge{0%{transform:translateX(-50%) scale(0)}70%{transform:translateX(-50%) scale(1.12)}100%{transform:translateX(-50%) scale(1)}}

/* 科目グラフ */
.res-graph-wrap{
  width:100%;max-width:330px;
  background:var(--card);border-radius:14px;
  padding:14px 16px;margin-bottom:12px;
  border:1px solid var(--border);
}
.res-graph-title{font-size:.82rem;font-weight:900;margin-bottom:12px;color:white}
.res-graph-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.res-graph-lbl{font-size:.75rem;font-weight:700;width:60px;flex-shrink:0;color:var(--muted)}
.res-graph-bar-wrap{flex:1;background:rgba(255,255,255,.07);border-radius:99px;height:18px;overflow:hidden}
.res-graph-bar{height:100%;border-radius:99px;transition:width 1s ease;display:flex;align-items:center;justify-content:flex-end;padding-right:6px}
.res-graph-pct{font-size:.65rem;font-weight:900;color:white}
.res-graph-cnt{font-size:.7rem;font-weight:700;width:36px;text-align:right;color:var(--muted);flex-shrink:0}
</style>
</head>
<body>
<div class="confetti-c" id="ccont"></div>
<div class="toast" id="toast"></div>

<!-- HOME -->
<div class="screen active" id="home">
  <div class="home-logo">⚡ 先生クイズ</div>
  <div class="home-sub">テストを選ぼう</div>
  <div class="scrollbody">
    <div id="test-list"></div>
    <button class="new-btn" onclick="goNewTest()">＋ 新しいテストを作る</button>
  </div>
</div>

<!-- TEST DETAIL -->
<div class="screen" id="testdetail">
  <div class="hdr">
    <button class="hdr-back" onclick="showScreen('home')">←</button>
    <div class="hdr-title" id="td-title"></div>
    <button class="hdr-act" onclick="goAddPhotos()">📷 追加</button>
  </div>
  <div class="scrollbody">
    <div class="subj-grid" id="td-grid"></div>
  </div>
</div>

<!-- NEW TEST -->
<div class="screen" id="newtest">
  <div class="hdr">
    <button class="hdr-back" onclick="showScreen('home')">←</button>
    <div class="hdr-title">新しいテスト</div>
  </div>
  <div class="scrollbody">
    <span class="lbl">テスト名</span>
    <input class="inp" id="nt-name" placeholder="例：前期第1回" maxlength="30"/>
    <span class="lbl">科目（複数OK）</span>
    <div id="nt-chips" style="margin-bottom:15px"></div>
    <span class="lbl">写真（最大20枚）</span>
    <label class="upl" id="nt-upl">
      <input type="file" accept="image/*" multiple onchange="onPhotos(event,false)"/>
      <div style="font-size:2.2rem;margin-bottom:7px">📷</div>
      <div id="nt-upl-txt" style="color:#ccc;font-weight:700;font-size:.92rem">タップして写真を選ぶ</div>
      <div style="font-size:.72rem;color:var(--muted);margin-top:3px">プリント・教科書（最大20枚）</div>
    </label>
    <div class="thumb-strip" id="nt-thumbs" style="display:none"></div>
    <div id="nt-prog-wrap" style="display:none">
      <div style="display:flex;justify-content:space-between;font-size:.73rem;color:var(--muted);margin-bottom:4px"><span>処理中…</span><span id="nt-prog-pct">0%</span></div>
      <div class="prog-bar"><div class="prog-fill" id="nt-prog-fill" style="width:0%"></div></div>
      <div class="log-wrap" id="nt-log"></div>
    </div>
    <button class="btn" id="nt-gen-btn" style="background:linear-gradient(135deg,#ffd700,#ff6b35);color:#1a0a00" onclick="generateAll()" disabled>✨ AIで問題を全部作る</button>
  </div>
</div>

<!-- ADD PHOTOS -->
<div class="screen" id="addphotos">
  <div class="hdr">
    <button class="hdr-back" onclick="showScreen('testdetail')">←</button>
    <div class="hdr-title">📷 問題を追加</div>
  </div>
  <div class="scrollbody">
    <span class="lbl">科目</span>
    <div id="ap-chips" style="margin-bottom:15px"></div>
    <span class="lbl">写真（最大20枚）</span>
    <label class="upl" id="ap-upl">
      <input type="file" accept="image/*" multiple onchange="onPhotos(event,true)"/>
      <div style="font-size:2.2rem;margin-bottom:7px">📷</div>
      <div id="ap-upl-txt" style="color:#ccc;font-weight:700;font-size:.92rem">タップして写真を選ぶ</div>
    </label>
    <div class="thumb-strip" id="ap-thumbs" style="display:none"></div>
    <div id="ap-prog-wrap" style="display:none">
      <div style="display:flex;justify-content:space-between;font-size:.73rem;color:var(--muted);margin-bottom:4px"><span>処理中…</span><span id="ap-prog-pct">0%</span></div>
      <div class="prog-bar"><div class="prog-fill" id="ap-prog-fill" style="width:0%"></div></div>
      <div class="log-wrap" id="ap-log"></div>
    </div>
    <button class="btn" id="ap-gen-btn" style="background:linear-gradient(135deg,#ffd700,#ff6b35);color:#1a0a00" onclick="apGenerateAll()" disabled>✨ AIで問題を追加する</button>
  </div>
</div>

<!-- INTRO -->
<div class="screen" id="intro">
  <div class="intro-bg" id="intro-bg"></div>
  <!-- テスト名バッジ -->
  <div class="intro-test-name" id="intro-test-name"></div>
  <!-- キャラ -->
  <div class="intro-char-wrap"><img id="intro-img" src="" alt=""/></div>
  <!-- パネル -->
  <div class="intro-panel">
    <div class="intro-lbl" id="intro-lbl"></div>
    <div class="intro-cheer" id="intro-cheer"></div>
    <div class="intro-txt" id="intro-txt"></div>
    <div style="display:flex;justify-content:center;margin-top:4px">
      <button class="btn intro-start-btn" id="intro-start-btn" onclick="beginQuiz()">スタート！⚡</button>
    </div>
  </div>
</div>

<!-- QUIZ -->
<div class="screen" id="quiz">
  <div class="qz-bar">
    <div class="qz-score-badge">⭐ <span id="q-score">0</span></div>
    <div class="qz-right-badges">
      <div class="qz-streak-badge" id="streak-pill">🔥 0</div>
      <div class="qz-num-badge" id="qz-num-badge">1 / 10</div>
    </div>
  </div>
  <div class="qz-segs-row" id="qz-segs"></div>

  <div class="qz-card">
    <div class="qz-char-col">
      <img class="qz-char-img" id="quiz-char" src="" alt=""/>
      <div class="qz-bubble">
        <div class="qz-bubble-name" id="qz-bubble-name"></div>
        <div class="qz-bubble-txt" id="qz-bubble-txt">…</div>
      </div>
    </div>
    <div class="qz-q-col">
      <div class="qz-q-tag" id="qtag"></div>
      <div class="qz-q-txt" id="qtxt"></div>
    </div>
  </div>

  <div class="qz-bottom">
    <div class="qz-choices" id="choices"></div>
    <div class="qz-feedback" id="fbtxt">
      <div class="qz-fb-icon" id="fb-icon"></div>
      <div class="qz-fb-body">
        <div class="qz-fb-title" id="fb-title"></div>
        <div class="qz-fb-explain" id="fb-explain"></div>
      </div>
    </div>
    <button class="qz-next" id="nxt-btn" onclick="nextQ()">次の問題へ →</button>
  </div>
</div>

<!-- RESULT -->
<div class="screen" id="result">
  <div class="scrollbody" style="display:flex;flex-direction:column;align-items:center">
    <div class="res-char"><img id="res-img" src="" alt=""/></div>
    <div class="res-title" id="res-title"></div>
    <div class="res-pts" id="res-pts">0</div>
    <div class="res-ptslbl">ポイント獲得！</div>
    <div class="res-stats">
      <div class="rstat"><div class="rl">✅ 正解</div><div class="rv" id="r-ok" style="color:#44cc88"></div></div>
      <div class="rstat"><div class="rl">❌ まちがい</div><div class="rv" id="r-ng" style="color:#ff6666"></div></div>
      <div class="rstat"><div class="rl">🔥 最高連続</div><div class="rv" id="r-str" style="color:#ffd700"></div></div>
    </div>
    <div class="res-msg" id="res-msg"></div>

    <!-- 間違え直しボタン -->
    <div id="res-retry-wrap" style="display:none;width:100%;max-width:330px;margin-bottom:10px">
      <button class="btn res-revenge-btn" id="res-revenge" onclick="startRevenge()">
        🔥 間違えた問題をやり直す
      </button>
      <div class="res-wrong-list" id="res-wrong-list"></div>
    </div>

    <!-- 科目別成績グラフ -->
    <div class="res-graph-wrap" id="res-graph-wrap" style="display:none">
      <div class="res-graph-title">📊 科目別せいせき</div>
      <div id="res-graph-bars"></div>
    </div>

    <button class="btn" id="res-retry" onclick="retryQuiz()" style="max-width:330px">もう一度！🔄</button>
    <div style="color:var(--muted);font-size:.82rem;font-weight:700;cursor:pointer;text-decoration:underline;text-align:center;margin-top:3px" onclick="showScreen('testdetail')">テスト選択に戻る</div>
  </div>
</div>
