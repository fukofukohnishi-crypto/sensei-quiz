<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="「積」＝かたまりでもこもこした雲">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#bfe0fb"/><stop offset="1" stop-color="#e8f4ff"/></linearGradient>
<clipPath id="cp"><circle cx="100" cy="100" r="96"/></clipPath>
</defs>
<circle cx="100" cy="100" r="96" fill="url(#bg)"/>
<g clip-path="url(#cp)">
  <!-- かたまりになって、もこもこと上にふくらんでいる -->
  <g fill="#ffffff">
    <circle cx="100" cy="72" r="34"/><circle cx="66" cy="96" r="28"/><circle cx="134" cy="94" r="30"/>
    <circle cx="84" cy="62" r="22"/><circle cx="120" cy="58" r="20"/>
    <rect x="38" y="96" width="124" height="34" rx="16"/>
  </g>
  <g fill="#d7e6f4">
    <rect x="38" y="116" width="124" height="16" rx="8"/>
  </g>
</g>
<circle cx="100" cy="100" r="96" fill="none" stroke="#cfe0f0" stroke-width="3"/>
</svg>
