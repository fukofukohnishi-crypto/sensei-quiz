<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" width="560" height="320" role="img" aria-label="雲があらわれる高さの三つの層">
  <rect x="0" y="0" width="560" height="320" fill="#141428"/>
  <!-- 帯 -->
  <rect x="70" y="18"  width="470" height="86" fill="#2b3a5c" opacity=".5"/>
  <rect x="70" y="112" width="470" height="86" fill="#2f4a52" opacity=".5"/>
  <rect x="70" y="206" width="470" height="76" fill="#3d3a52" opacity=".5"/>
  <!-- 地面 -->
  <rect x="0" y="282" width="560" height="38" fill="#3b4a33"/>
  <!-- 高さの目盛 -->
  <g stroke="#8d8daa" stroke-width="1.4" stroke-dasharray="7 5">
    <path d="M70 104 L540 104"/><path d="M70 198 L540 198"/>
  </g>
  <g fill="#b9b9d0" font-size="15" font-family="-apple-system,BlinkMacSystemFont,'Hiragino Sans',sans-serif" text-anchor="end">
    <text x="62" y="26">13km</text><text x="62" y="109">5km</text><text x="62" y="203">2km</text><text x="62" y="288">地上</text>
  </g>
  <!-- 雲のかたち -->
  <g fill="#e6ecf7" opacity=".92">
    <ellipse cx="180" cy="52" rx="34" ry="9"/><ellipse cx="300" cy="40" rx="26" ry="8"/><ellipse cx="410" cy="62" rx="30" ry="8"/>
    <ellipse cx="200" cy="150" rx="30" ry="14"/><ellipse cx="228" cy="146" rx="24" ry="16"/>
    <ellipse cx="370" cy="158" rx="34" ry="13"/>
    <ellipse cx="180" cy="248" rx="28" ry="17"/><ellipse cx="212" cy="244" rx="22" ry="20"/>
    <ellipse cx="400" cy="252" rx="36" ry="16"/><ellipse cx="430" cy="246" rx="26" ry="19"/>
  </g>
  <!-- ラベル -->
  <g font-family="-apple-system,BlinkMacSystemFont,'Hiragino Sans',sans-serif" font-weight="700" font-size="22">
    <circle cx="502" cy="52"  r="21" fill="#23233d" stroke="#ffd700" stroke-width="2"/>
    <text x="502" y="60" text-anchor="middle" fill="#ffd700">①</text>
    <circle cx="502" cy="150" r="21" fill="#23233d" stroke="#ffd700" stroke-width="2"/>
    <text x="502" y="158" text-anchor="middle" fill="#ffd700">②</text>
    <circle cx="502" cy="244" r="21" fill="#23233d" stroke="#ffd700" stroke-width="2"/>
    <text x="502" y="252" text-anchor="middle" fill="#ffd700">③</text>
  </g>
</svg>
