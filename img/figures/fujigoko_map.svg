<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img"
 aria-label="富士五湖。西から本栖湖・精進湖・西湖・河口湖・山中湖。山中湖の水面がいちばん高く、河口湖の水面がいちばん低い">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#eef5fb"/><stop offset="1" stop-color="#e2eef7"/></linearGradient>
<linearGradient id="mt" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#8fa7bd"/><stop offset="1" stop-color="#6d8399"/></linearGradient>
<linearGradient id="lk" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#4ea0dc"/><stop offset="1" stop-color="#2f7cb8"/></linearGradient>
</defs>
<rect width="760" height="400" rx="16" fill="url(#bg)"/>

<!-- 地面 -->
<path d="M0,300 C 120,286 240,292 380,286 C 520,280 640,290 760,282 L760,400 L0,400 Z" fill="#cfe2d3"/>
<path d="M0,300 C 120,286 240,292 380,286 C 520,280 640,290 760,282" fill="none" stroke="#b6d0bc" stroke-width="3"/>

<!-- 富士山 -->
<path d="M150,330 C 210,300 260,250 330,168 C 400,250 452,300 512,330 Z" fill="url(#mt)"/>
<path d="M330,168 C 352,194 372,216 392,238
         C 380,232 372,242 360,236 C 348,230 342,240 330,234
         C 318,240 312,230 300,236 C 288,242 280,232 268,238
         C 288,216 308,194 330,168 Z" fill="#ffffff"/>
<text x="331" y="292" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#ffffff">富士山</text>

<!-- 湖 -->
<g font-family="sans-serif" font-size="24" font-weight="700" fill="#1d3a55">
  <path d="M52,150 C 74,136 104,138 116,152 C 126,164 116,180 94,184 C 68,188 44,172 52,150 Z" fill="url(#lk)"/>
  <text x="84" y="120" text-anchor="middle">本栖湖</text>
  <path d="M150,166 C 166,158 184,162 188,174 C 192,186 176,194 162,190 C 146,186 138,174 150,166 Z" fill="url(#lk)"/>
  <text x="166" y="142" text-anchor="middle">精進湖</text>
  <path d="M212,140 C 240,126 274,130 282,144 C 290,158 270,172 244,170 C 216,168 198,154 212,140 Z" fill="url(#lk)"/>
  <text x="240" y="110" text-anchor="middle">西湖</text>
  <path d="M316,124 C 350,108 404,112 416,128 C 428,146 400,162 362,160 C 326,158 300,140 316,124 Z" fill="url(#lk)"/>
  <text x="340" y="104" text-anchor="middle">河口湖</text>
  <path d="M556,180 C 596,162 648,168 660,186 C 672,206 640,224 598,220 C 560,216 536,196 556,180 Z" fill="url(#lk)"/>
  <text x="606" y="154" text-anchor="middle">山中湖</text>
</g>

<!-- いちばん高い／いちばん低い -->
<g font-family="sans-serif" font-weight="700" font-size="21">
  <g>
    <path d="M417,52 V112" stroke="#2f7cb8" stroke-width="3"/>
    <path d="M417,124 L408,104 L426,104 Z" fill="#2f7cb8"/>
    <rect x="310" y="18" width="214" height="36" rx="18" fill="#2f7cb8"/>
    <text x="417" y="43" text-anchor="middle" fill="#ffffff">水面がいちばん低い</text>
  </g>
  <g>
    <path d="M620,232 V262" stroke="#e8a020" stroke-width="3"/>
    <path d="M620,214 L611,234 L629,234 Z" fill="#e8a020"/>
    <rect x="513" y="258" width="214" height="36" rx="18" fill="#e8a020"/>
    <text x="620" y="283" text-anchor="middle" fill="#ffffff">水面がいちばん高い</text>
  </g>
</g>

<!-- 西と東、まとめ -->
<g font-family="sans-serif" fill="#41637a">
  <path d="M44,352 H716" stroke="#9db6c6" stroke-width="2" stroke-dasharray="6 7"/>
  <path d="M44,352 L58,345 L58,359 Z" fill="#9db6c6"/>
  <path d="M716,352 L702,345 L702,359 Z" fill="#9db6c6"/>
  <text x="70" y="345" font-size="21" font-weight="700">西</text>
  <text x="672" y="345" font-size="21" font-weight="700">東</text>
  <text x="380" y="384" text-anchor="middle" font-size="20">5つまとめて「富士五湖」。噴火で川がせき止められてできた堰止湖</text>
</g>
</svg>
