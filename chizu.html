<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#0d0d20">
<link rel="manifest" href="/manifest.json">
<title>オリジナル先生 — 都道府県マップ</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0d14;--card:#16162a;--card2:#1c1c30;--border:rgba(255,255,255,.08);--text:#f0f0f0;--muted:#8a8a9c;--gold:#ffd700}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:'Noto Sans JP',sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
button{cursor:pointer;font-family:inherit;border:none}
.app{max-width:820px;margin:0 auto;height:100%;position:relative;overflow:hidden;background:radial-gradient(ellipse at 20% 6%,#1a0a2e,transparent 55%),radial-gradient(ellipse at 85% 92%,#0a182e,transparent 50%),var(--bg)}
.screen{display:none;height:100%;flex-direction:column;overflow:hidden}
.screen.active{display:flex}
.hdr{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--border);background:rgba(17,17,32,.7);backdrop-filter:blur(6px);flex-shrink:0}
.hdr-back{background:none;color:var(--muted);font-size:.78rem;font-weight:900;text-decoration:none;white-space:nowrap}
.hdr-title{font-size:1rem;font-weight:900;flex:1;text-align:center}
.hdr-progress{font-size:.72rem;font-weight:900;color:var(--gold);background:rgba(255,215,0,.1);border:1px solid rgba(255,215,0,.3);border-radius:99px;padding:4px 10px;white-space:nowrap}
.body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 14px 30px}

/* ===== map screen ===== */
.map-lead{text-align:center;font-size:.8rem;color:var(--muted);font-weight:700;margin-bottom:10px;line-height:1.6}
.map-wrap{border-radius:18px;overflow:hidden;border:1px solid var(--border);background:var(--card);padding:8px}
#japan-svg-map .prefecture{fill:#2a2a3e;stroke:#7a7a99;stroke-width:1.3px;cursor:pointer;transition:fill .15s}
#japan-svg-map .prefecture:active{opacity:.75}
#japan-svg-map .prefecture.p-partial{fill:#8a6a1e}
#japan-svg-map .prefecture.p-done{fill:#caa000}
#japan-svg-map .prefecture.p-nodata{fill:#22222e;stroke:#44445a;cursor:default}
.legend{display:flex;gap:14px;justify-content:center;margin-top:10px;font-size:.68rem;color:var(--muted);font-weight:700}
.legend span{display:inline-flex;align-items:center;gap:5px}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block}

/* ===== reveal screen ===== */
#reveal-screen .body{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
.char-avatar{width:180px;height:180px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:5rem;box-shadow:0 0 0 6px rgba(255,255,255,.06),0 14px 40px rgba(0,0,0,.5);animation:popin .45s cubic-bezier(.2,1.4,.4,1);margin-bottom:16px}
@keyframes popin{0%{transform:scale(.2);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.char-name{font-size:1.4rem;font-weight:900;color:var(--gold);margin-bottom:4px}
.char-pref{font-size:.8rem;color:var(--muted);font-weight:700;margin-bottom:16px}
.char-line{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 18px;font-size:.95rem;line-height:1.8;text-align:left;max-width:440px}
.char-line b{color:var(--gold)}

/* ===== shared buttons ===== */
.bigbtn{width:100%;max-width:440px;padding:16px;border-radius:14px;font-weight:900;font-size:1.02rem;color:#1a0a00;background:linear-gradient(135deg,var(--gold),#ff6b35);margin-top:18px}
.bigbtn:active{transform:scale(.98)}
.bigbtn.blue{color:#fff;background:linear-gradient(135deg,#6699ff,#2244cc)}

/* ===== quiz screen ===== */
#quiz-screen .body{display:flex;flex-direction:column;padding:18px 16px}
.qz-q{font-size:1.05rem;font-weight:900;line-height:1.6;margin-bottom:16px;background:var(--card);border-radius:14px;padding:16px;border:1px solid var(--border)}
.qz-choice{width:100%;text-align:left;padding:15px 16px;border-radius:13px;border:1.5px solid var(--border);background:var(--card2);color:var(--text);font-weight:700;font-size:.92rem;margin-bottom:10px}
.qz-choice:active{opacity:.8}
.qz-choice.correct{border-color:#44cc88;background:rgba(68,204,136,.18);color:#7fe8b0}
.qz-choice.wrong{border-color:#ff5555;background:rgba(255,68,68,.18);color:#ff9a9a}

/* ===== result screen ===== */
#result-screen .body{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.medal{width:150px;height:150px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:4.2rem;margin-bottom:16px;border:5px solid var(--gold);background:radial-gradient(circle at 35% 30%,#3a2e00,#1a1400);box-shadow:0 0 40px rgba(255,215,0,.35);animation:popin .5s cubic-bezier(.2,1.4,.4,1);overflow:hidden}
.medal img{width:100%;height:100%;object-fit:cover}
.medal.guardian{border-color:#ff2288;box-shadow:0 0 46px rgba(255,34,136,.4)}
.result-ttl{font-size:1.3rem;font-weight:900;margin-bottom:6px}
.result-sub{font-size:.82rem;color:var(--muted);font-weight:700;margin-bottom:6px}
.result-keyword{font-size:1.1rem;font-weight:900;color:var(--gold);margin-bottom:14px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#222;border:1px solid var(--border);color:#fff;padding:10px 18px;border-radius:99px;font-size:.8rem;font-weight:700;opacity:0;pointer-events:none;transition:opacity .25s;z-index:999}
.toast.show{opacity:1}

/* ===== album screen ===== */
/* ===== album summary/detail bits (kept in case still referenced) ===== */
.album-summary{text-align:center;font-size:.78rem;color:var(--muted);font-weight:700;margin-bottom:12px}
.album-summary b{color:var(--gold)}
.album-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media(min-width:560px){.album-grid{grid-template-columns:repeat(6,1fr)}}
.album-tile{background:var(--card);border:1.5px solid var(--border);border-radius:13px;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;text-align:center;position:relative}
.album-tile.tile-locked{opacity:.42}
.album-tile.tile-done{border-color:var(--gold);background:rgba(255,215,0,.08)}
.album-icon{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.5rem;margin-bottom:6px}
.album-name{font-size:.62rem;font-weight:900;line-height:1.3;margin-bottom:5px;min-height:2.2em;display:flex;align-items:center}
.album-medals{display:flex;gap:3px}
.album-medal-dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.15)}
.album-medal-dot.on{background:var(--gold)}
.album-crown{position:absolute;top:-6px;right:-4px;font-size:.9rem}

/* ===== album detail overlay ===== */
.album-overlay{position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.85);backdrop-filter:blur(4px);padding:20px}
.album-overlay.show{display:flex}
.album-detail{max-width:340px;width:100%;background:var(--card);border:1.5px solid var(--border);border-radius:18px;padding:22px 18px;text-align:center}
.album-detail .char-avatar{width:110px;height:110px;font-size:3rem;margin:0 auto 12px}
.album-detail-name{font-size:1.1rem;font-weight:900;color:var(--gold);margin-bottom:2px}
.album-detail-pref{font-size:.76rem;color:var(--muted);font-weight:700;margin-bottom:14px}
.album-keyword-row{display:flex;align-items:center;gap:10px;background:var(--card2);border-radius:11px;padding:10px 14px;margin-bottom:8px;text-align:left}
.album-keyword-row .k-ic{font-size:1.1rem;width:20px;text-align:center}
.album-keyword-row .k-txt{flex:1;font-size:.86rem;font-weight:700}
.album-keyword-row.locked .k-txt{color:var(--muted)}
.album-close{margin-top:14px;width:100%;padding:13px;border-radius:12px;background:linear-gradient(135deg,var(--gold),#ff6b35);color:#1a0a00;font-weight:900;font-size:.92rem}

/* ===== prefecture detail screen ===== */
#pref-detail-screen .body{display:flex;flex-direction:column;align-items:center;text-align:center;padding:20px 16px}
.pd-avatar{width:120px;height:120px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:3.4rem;box-shadow:0 0 0 5px rgba(255,255,255,.06),0 10px 30px rgba(0,0,0,.5);margin-bottom:12px}
.pd-name{font-size:1.2rem;font-weight:900;color:var(--gold);margin-bottom:2px}
.pd-pref{font-size:.78rem;color:var(--muted);font-weight:700;margin-bottom:4px}
.pd-progress{font-size:.85rem;font-weight:900;margin-bottom:16px}
.pd-progress b{color:var(--gold)}
.pd-medal-row{display:flex;flex-wrap:wrap;justify-content:center;gap:12px 10px;margin-bottom:20px;max-width:460px}
.pd-medal-slot{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.4rem;border:3px solid var(--border);background:var(--card2);position:relative;overflow:hidden}
.pd-medal-slot img{width:100%;height:100%;object-fit:cover}
.pd-medal-slot.got{border-color:var(--gold);background:radial-gradient(circle at 35% 30%,#3a2e00,#1a1400);box-shadow:0 0 14px rgba(255,215,0,.3)}
.pd-medal-slot.locked{opacity:.5}
.pd-medal-label{font-size:.56rem;font-weight:900;color:var(--muted);margin-top:5px;max-width:66px;line-height:1.25}
.pd-medal-col{display:flex;flex-direction:column;align-items:center;width:70px}
.pd-guardian-banner{background:rgba(255,34,136,.1);border:1px solid rgba(255,34,136,.35);border-radius:12px;padding:10px 14px;font-size:.8rem;font-weight:900;color:#ff88bb;margin-bottom:16px}

/* ===== medal enlarge overlay ===== */
.medal-enlarge-body{max-width:300px;width:100%;background:var(--card);border:1.5px solid var(--gold);border-radius:20px;padding:26px 20px;text-align:center}
.medal-enlarge-icon{width:150px;height:150px;border-radius:50%;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;font-size:4rem;border:5px solid var(--gold);background:radial-gradient(circle at 35% 30%,#3a2e00,#1a1400);box-shadow:0 0 40px rgba(255,215,0,.35);overflow:hidden}
.medal-enlarge-keyword{font-size:1.3rem;font-weight:900;color:var(--gold);margin-bottom:4px}
.medal-enlarge-sub{font-size:.76rem;color:var(--muted);font-weight:700;margin-bottom:16px}
</style>
</head>

        choices:["ゆいレール（モノレール）","新幹線","地下鉄","路面電車"], answer:0},
      {keyword:"パイナップル", image:"/chars/medals/kyushu/pineapple.png",
        q:"沖縄県で多く栽培されている、南国フルーツは？",
        choices:["パイナップル","りんご","みかん","ぶどう"], answer:0},
      {keyword:"リュウキュウイノシシ", image:"/chars/medals/kyushu/ryukyuinoshishi.png",
        q:"沖縄などの南西諸島に生息する、体が小さめの野生のイノシシは？",
        choices:["リュウキュウイノシシ","エゾシカ","ニホンカモシカ","ツキノワグマ"], answer:0},
      {keyword:"西表島", image:"/chars/medals/kyushu/iriomotejima.png",
        q:"沖縄県にある、イリオモテヤマネコの生息地として知られる島は？",
        choices:["西表島","石垣島","久米島","宮古島"], answer:0}
    ]}
};

const STORAGE_KEY = 'sensei_collection_v2';
let currentPref = null, currentMedalIdx = null;

/* 全47都道府県名（データ未整備の県もアルバムに「？」として並べるため） */
const PREF_NAMES = {
  "01":"北海道","02":"青森県","03":"岩手県","04":"宮城県","05":"秋田県","06":"山形県","07":"福島県",
  "08":"茨城県","09":"栃木県","10":"群馬県","11":"埼玉県","12":"千葉県","13":"東京都","14":"神奈川県",
  "15":"新潟県","16":"富山県","17":"石川県","18":"福井県","19":"山梨県","20":"長野県","21":"岐阜県",
  "22":"静岡県","23":"愛知県","24":"三重県","25":"滋賀県","26":"京都府","27":"大阪府","28":"兵庫県",
  "29":"奈良県","30":"和歌山県","31":"鳥取県","32":"島根県","33":"岡山県","34":"広島県","35":"山口県",
  "36":"徳島県","37":"香川県","38":"愛媛県","39":"高知県","40":"福岡県","41":"佐賀県","42":"長崎県",
  "43":"熊本県","44":"大分県","45":"宮崎県","46":"鹿児島県","47":"沖縄県"
};

function loadProgress(){
  try{ return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); }catch(e){ return {}; }
}
function saveProgress(p){ localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); }
function getPrefProgress(code){
  const all = loadProgress();
  const data = PREF_DATA[code];
  const n = data ? data.medals.length : 3;
  const existing = all[code];
  if(existing && existing.medals.length === n) return existing;
  const medals = Array(n).fill(false);
  if(existing) existing.medals.forEach((v,i)=>{ if(i<n) medals[i]=v; });
  return { medals, guardianGot: existing ? existing.guardianGot : false };
}
function setPrefProgress(code, prog){
  const all = loadProgress();
  all[code] = prog;
  saveProgress(all);
}

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}

function goMap(){ showScreen('map-screen'); renderMapState(); renderProgressLabel(); }

function renderProgressLabel(){
  let medalsGot = 0, totalMedals = 0;
  Object.keys(PREF_DATA).forEach(code=>{
    totalMedals += PREF_DATA[code].medals.length;
    medalsGot += getPrefProgress(code).medals.filter(Boolean).length;
  });
  document.getElementById('progress-label').textContent = `メダル ${medalsGot}/${totalMedals}`;
}

function renderMapState(){
  document.querySelectorAll('#japan-svg-map .prefecture').forEach(g=>{
    const code = g.getAttribute('data-code');
    g.classList.remove('p-partial','p-done','p-nodata');
    if(!PREF_DATA[code]){ g.classList.add('p-nodata'); return; }
    const prog = getPrefProgress(code);
    if(prog.guardianGot) g.classList.add('p-done');
    else if(prog.medals.some(Boolean)) g.classList.add('p-partial');
  });
}

function openPrefDetail(code){
  const data = PREF_DATA[code];
  if(!data){ showToast((PREF_NAMES[code]||'この県')+'はじゅんびちゅう！'); return; }
  currentPref = code;
  renderPrefDetail(code);
  showScreen('pref-detail-screen');
}

function closePrefDetail(){
  showScreen('map-screen');
  renderMapState();
  renderProgressLabel();
}

function renderPrefDetail(code){
  const data = PREF_DATA[code];
  const prog = getPrefProgress(code);
  const total = data.medals.length;
  const gotCount = prog.medals.filter(Boolean).length;

  document.getElementById('pd-title').textContent = data.name;
  document.getElementById('pd-avatar').style.background = `radial-gradient(circle at 35% 30%,${data.color},#0a0a10)`;
  document.getElementById('pd-avatar').textContent = data.emoji;
  document.getElementById('pd-avatar').style.backgroundImage = '';
  document.getElementById('pd-name').textContent = data.guardianName;
  document.getElementById('pd-pref').textContent = data.name + 'の守護神';
  document.getElementById('pd-progress').innerHTML = `メダル <b>${gotCount}/${total}</b>`;
  document.getElementById('pd-guardian-banner').style.display = prog.guardianGot ? '' : 'none';

  tryLoadImageInto(document.getElementById('pd-avatar'), data.guardianImage);

  const row = document.getElementById('pd-medal-row');
  row.innerHTML = '';
  data.medals.forEach((m,i)=>{
    const got = prog.medals[i];
    const col = document.createElement('div');
    col.className = 'pd-medal-col';
    const slot = document.createElement('div');
    slot.className = 'pd-medal-slot ' + (got ? 'got' : 'locked');
    if(got && m.image){
      slot.innerHTML = `<img src="${m.image}" alt="${m.keyword}" onerror="this.style.display='none';this.parentNode.textContent='🏅'">`;
    }else{
      slot.textContent = got ? '🏅' : '🔒';
    }
    if(got) slot.onclick = ()=>openMedalEnlarge(code, i);
    else slot.onclick = ()=>showToast('クイズに正解すると手に入るよ！');
    const label = document.createElement('div');
    label.className = 'pd-medal-label';
    label.textContent = got ? m.keyword : '？？？';
    col.appendChild(slot);
    col.appendChild(label);
    row.appendChild(col);
  });

  const cta = document.getElementById('pd-cta-btn');
  if(gotCount >= total){ cta.textContent = 'もう一度あそぶ →'; }
  else { cta.textContent = 'クイズに挑戦する →'; }
}

function openMedalEnlarge(code, idx){
  const data = PREF_DATA[code];
  const m = data.medals[idx];
  const body = document.getElementById('medal-enlarge-body');
  const iconHtml = m.image
    ? `<img src="${m.image}" alt="${m.keyword}" style="width:100%;height:100%;object-fit:cover;border-radius:50%" onerror="this.parentNode.textContent='🏅'">`
    : '🏅';
  body.innerHTML = `
    <div class="medal-enlarge-icon">${iconHtml}</div>
    <div class="medal-enlarge-keyword">${m.keyword}</div>
    <div class="medal-enlarge-sub">${data.name}・${data.guardianName}のメダル</div>
    <button class="album-close" onclick="closeMedalEnlarge()">とじる</button>`;
  document.getElementById('medal-enlarge-overlay').classList.add('show');
}
function closeMedalEnlarge(){ document.getElementById('medal-enlarge-overlay').classList.remove('show'); }

function goRevealForQuiz(){
  const code = currentPref;
  const prog = getPrefProgress(code);
  let idx = prog.medals.findIndex(m=>!m);
  if(idx === -1) idx = 0; // 全部取得済みなら復習として1問目から
  currentMedalIdx = idx;
  goQuiz();
}

function tryLoadImageInto(el, src){
  if(!src) return;
  const img = new Image();
  img.onload = ()=>{ el.style.backgroundImage = `url(${src})`; el.style.backgroundSize='cover'; el.style.backgroundPosition='top center'; el.textContent=''; };
  img.onerror = ()=>{}; // 画像がまだ無ければ絵文字のままでOK
  img.src = src;
}

let currentShuffledChoices = [];

function shuffleArray(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function goQuiz(){
  const data = PREF_DATA[currentPref];
  const m = data.medals[currentMedalIdx];
  document.getElementById('quiz-pref-title').textContent = data.name;
  document.getElementById('qz-q').textContent = m.q;

  currentShuffledChoices = shuffleArray(m.choices.map((c,i)=>({text:c, correct:i===m.answer})));

  const wrap = document.getElementById('qz-choices');
  wrap.innerHTML = '';
  currentShuffledChoices.forEach((c,i)=>{
    const b = document.createElement('button');
    b.className = 'qz-choice';
    b.textContent = c.text;
    b.onclick = ()=>answerQuiz(i, b);
    wrap.appendChild(b);
  });
  showScreen('quiz-screen');
}

function answerQuiz(i, btnEl){
  document.querySelectorAll('.qz-choice').forEach(b=>b.onclick=null);
  if(currentShuffledChoices[i].correct){
    btnEl.classList.add('correct');
    setTimeout(()=>onQuizCorrect(), 500);
  }else{
    btnEl.classList.add('wrong');
    const correctIdx = currentShuffledChoices.findIndex(c=>c.correct);
    document.querySelectorAll('.qz-choice')[correctIdx].classList.add('correct');
    setTimeout(()=>{ showToast('もういちど挑戦してみよう！'); openPrefDetail(currentPref); }, 1400);
  }
}

function onQuizCorrect(){
  const data = PREF_DATA[currentPref];
  const total = data.medals.length;
  const m = data.medals[currentMedalIdx];
  const prog = getPrefProgress(currentPref);
  const alreadyGot = prog.medals[currentMedalIdx];
  prog.medals[currentMedalIdx] = true;

  const allGot = prog.medals.every(Boolean);
  const guardianNewlyGot = allGot && !prog.guardianGot;
  if(guardianNewlyGot) prog.guardianGot = true;
  setPrefProgress(currentPref, prog);

  const medalEl = document.getElementById('result-medal');
  if(guardianNewlyGot){
    medalEl.classList.add('guardian');
    medalEl.innerHTML = '';
    medalEl.textContent = data.emoji;
    document.getElementById('result-ttl').textContent = `🎉 メダルクリア！（${data.guardianName}）`;
    document.getElementById('result-sub').textContent = `${data.name}のメダルを${total}個とも集めた！守護神カード獲得！`;
    document.getElementById('result-keyword').textContent = '';
  }else{
    medalEl.classList.remove('guardian');
    if(m.image){ medalEl.innerHTML = `<img src="${m.image}" alt="${m.keyword}" onerror="this.style.display='none';this.parentNode.textContent='🏅'">`; }
    else{ medalEl.innerHTML=''; medalEl.textContent = '🏅'; }
    document.getElementById('result-ttl').textContent = alreadyGot ? 'せいかい！（復習）' : 'メダル獲得！';
    document.getElementById('result-sub').textContent = `${data.name}のメダル ${prog.medals.filter(Boolean).length}/${total}`;
    document.getElementById('result-keyword').textContent = m.keyword;
  }
  showScreen('result-screen');
}

function backToPrefDetailAfterResult(){
  renderPrefDetail(currentPref);
  showScreen('pref-detail-screen');
}

/* ===== 起動 ===== */
document.querySelectorAll('#japan-svg-map .prefecture').forEach(g=>{
  const code = g.getAttribute('data-code');
  g.addEventListener('click', ()=>openPrefDetail(code));
});
renderMapState();
renderProgressLabel();
</script>
</body>
</html>
